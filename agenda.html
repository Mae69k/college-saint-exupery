<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Agenda - Collège Saint-Exupéry</title>
<link rel='icon' type='image/png' href='assets/favicon.png'>
<link rel='stylesheet' href='style.css'>
<style>
.agenda-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:16px;
}
.agenda-nav{
  display:flex;
  align-items:center;
  gap:8px;
}
.agenda-btn{
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  color:var(--navy-dark);
  font-family:Arial, sans-serif;
  font-size:.9rem;
  font-weight:600;
  cursor:pointer;
}
.agenda-btn:hover{border-color:var(--navy);}
.agenda-mois{
  font-family:Arial, sans-serif;
  font-size:1.05rem;
  font-weight:700;
  color:var(--navy-dark);
  min-width:190px;
  text-align:center;
}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  gap:6px;
  margin-bottom:8px;
}
.cal-nom{
  text-align:center;
  font-size:.78rem;
  font-weight:700;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:.04em;
  padding-bottom:4px;
}
.cal-case{
  min-height:84px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  padding:6px;
}
.cal-case.hors{
  background:#f7f8fa;
  opacity:.55;
}
.cal-case.aujourdhui{
  border-color:var(--navy);
  box-shadow:inset 0 0 0 1px var(--navy);
}
.cal-num{
  font-size:.8rem;
  font-weight:700;
  color:var(--navy-dark);
  margin-bottom:4px;
}
.cal-case.hors .cal-num{color:var(--ink-soft);}
.cal-evt{
  display:block;
  width:100%;
  text-align:left;
  border:none;
  border-left:3px solid var(--sky);
  border-radius:4px;
  background:#f0f7fc;
  color:var(--navy-dark);
  font-family:Arial, sans-serif;
  font-size:.72rem;
  line-height:1.3;
  padding:4px 5px;
  margin-bottom:4px;
  cursor:pointer;
}
.cal-evt:hover{background:#e2f0fa;}
.cal-vide{
  color:var(--ink-soft);
  font-size:.9rem;
  margin:0 0 8px;
}
@media (max-width:700px){
  .cal-case{min-height:64px;}
  .cal-evt{font-size:.66rem;}
}
</style>
</head>
<body>
<script src='protect.js'></script>
<div class='topbar'>
  <div class='topbar-inner'>
    <img src='assets/favicon.png' alt='Collège Saint-Exupéry'>
    <div class='topbar-text'>
      <div class='etab'>Collège Saint-Exupéry</div>
      <div class='sub'>Agenda</div>
    </div>
  </div>
</div>
<div class='wrap' style='padding-top:32px; max-width:900px;'>
  <a href='index.html' class='back-link'>← Retour à l'accueil</a>
  <h1 style='font-family:Arial, sans-serif; color:var(--navy-dark); margin:14px 0 24px;'>Agenda du collège</h1>

  <div class='agenda-bar'>
    <div class='agenda-nav'>
      <button class='agenda-btn' type='button' id='cal-prev'>‹ Mois précédent</button>
      <span class='agenda-mois' id='cal-mois'></span>
      <button class='agenda-btn' type='button' id='cal-next'>Mois suivant ›</button>
    </div>
    <button class='agenda-btn' type='button' id='cal-today'>Aujourd'hui</button>
  </div>

  <div class='cal-grid' id='cal-noms'></div>
  <div class='cal-grid' id='cal-cases'></div>

  <h2 style='font-family:Arial, sans-serif; color:var(--navy-dark); font-size:1.15rem; margin:32px 0 14px;'>Tous les événements</h2>
  <div id='events-toutes' style='display:flex; flex-direction:column; gap:16px;'></div>

  <p style='color:var(--ink-soft); font-size:.9rem; margin-top:20px;'>* Les événements ci-dessus sont fournis à titre d'exemple tant qu'aucun contenu n'a été publié depuis l'espace d'administration.</p>
</div>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<script src='config.js'></script>
<script src='contenu-site.js'></script>
<script>
let evenements = CONTENU_DEFAUT.evenements;

const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];

let vue = new Date();

function cleJour(date) {
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const j = String(date.getDate()).padStart(2, '0');
  return `${date.getFullYear()}-${m}-${j}`;
}

// Accepte "01/10/2026", "1/10/2026" et "[Exemple : 08/10/2026]".
function lireDate(texte) {
  const m = String(texte || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return null;
  const jour = parseInt(m[1], 10);
  const mois = parseInt(m[2], 10);
  const annee = parseInt(m[3], 10);
  if (mois < 1 || mois > 12 || jour < 1 || jour > 31) return null;
  return new Date(annee, mois - 1, jour);
}

function eventsDuJour(cle) {
  return evenements.filter(e => {
    const d = lireDate(e.date);
    return d && cleJour(d) === cle;
  });
}

function renderCalendrier() {
  const annee = vue.getFullYear();
  const mois = vue.getMonth();

  document.getElementById('cal-mois').textContent =
    `${MOIS[mois]} ${annee}`;

  document.getElementById('cal-noms').innerHTML =
    JOURS.map(j => `<div class="cal-nom">${j}</div>`).join('');

  // Le 1er du mois : 0 = lundi ... 6 = dimanche
  const premier = new Date(annee, mois, 1);
  const decalage = (premier.getDay() + 6) % 7;
  const debut = new Date(annee, mois, 1 - decalage);

  const aujourdhui = cleJour(new Date());
  let html = '';

  for (let i = 0; i < 42; i++) {
    const jour = new Date(debut.getFullYear(), debut.getMonth(), debut.getDate() + i);
    const cle = cleJour(jour);
    const horsMois = jour.getMonth() !== mois;
    const classes = ['cal-case'];
    if (horsMois) classes.push('hors');
    if (cle === aujourdhui) classes.push('aujourdhui');

    const puces = eventsDuJour(cle).map(e =>
      `<button class="cal-evt" type="button" data-index="${evenements.indexOf(e)}">${echapperTexte(e.titre || e.date)}</button>`
    ).join('');

    html += `<div class="${classes.join(' ')}"><div class="cal-num">${jour.getDate()}</div>${puces}</div>`;
  }

  document.getElementById('cal-cases').innerHTML = html;
}

function afficherAgenda() {
  const zone = document.getElementById('events-toutes');

  if (evenements.length === 0) {
    zone.innerHTML = '<p class="cal-vide">Aucun événement pour le moment.</p>';
  } else {
    zone.innerHTML = evenements.map(e => `
      <div class='card' style='padding:20px 24px;'>
        <div style='display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px;'>
          <div style='font-weight:600; color:var(--navy-dark);'>${echapperTexte(e.titre)}</div>
          <div style='font-size:.9rem; color:var(--ink-soft);'>${echapperTexte(e.date)} • ${echapperTexte(e.heure)}</div>
        </div>
        <div style='font-size:.92rem; color:var(--ink-soft); margin-bottom:6px;'>Lieu : ${echapperTexte(e.lieu)}</div>
        <p style='color:var(--ink-soft); margin:0; line-height:1.6;'>${echapperTexte(e.description)}</p>
      </div>`).join('');
  }

  renderCalendrier();
}

document.getElementById('cal-prev').addEventListener('click', () => {
  vue = new Date(vue.getFullYear(), vue.getMonth() - 1, 1);
  renderCalendrier();
});

document.getElementById('cal-next').addEventListener('click', () => {
  vue = new Date(vue.getFullYear(), vue.getMonth() + 1, 1);
  renderCalendrier();
});

document.getElementById('cal-today').addEventListener('click', () => {
  vue = new Date();
  renderCalendrier();
});

document.getElementById('cal-cases').addEventListener('click', (e) => {
  const puce = e.target.closest('.cal-evt');
  if (!puce) return;
  const evenement = evenements[parseInt(puce.dataset.index, 10)];
  if (!evenement) return;
  alert(`${evenement.titre || ''}\n${evenement.date || ''} ${evenement.heure || ''}\nLieu : ${evenement.lieu || '—'}\n\n${evenement.description || ''}`);
});

afficherAgenda();

chargerContenu().then(contenu => {
  evenements = contenu.evenements;
  afficherAgenda();
});
</script>
</body>
</html>
