<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Agenda - Collège Saint-Exupéry</title>
<link rel='icon' type='image/png' href='assets/favicon.png'>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<script src='protect.js'></script>
<div class='topbar'>
  <div class='topbar-inner'>
    <img src='assets/favicon.png' alt='Collège Saint-Exupéry'>
    <div class='topbar-text'>
      <div class='etab'>Collège Saint-Exupéry</div>
      <div class='sub'>Agenda</div>
    </div>
  </div>
</div>
<div class='wrap' style='padding-top:32px; max-width:820px;'>
  <a href='index.html' class='back-link'>← Retour à l'accueil</a>
  <h1 style='font-family:Arial, sans-serif; color:var(--navy-dark); margin:14px 0 24px;'>Agenda du collège</h1>
  <div id='events-toutes' style='display:flex; flex-direction:column; gap:16px;'></div>
  <p style='color:var(--ink-soft); font-size:.9rem; margin-top:20px;'>* Les événements ci-dessous sont fournis à titre d'exemple uniquement. Ils ne correspondent pas à des événements réels.</p>
</div>
<script>
const evenements = [
  {date:'[Exemple : 08/10/2026]', heure:'[Ex. 14h00]', titre:'[Exemple - Réunion de rentrée]', lieu:'[Exemple - Salle]', description:'[Exemple - Description à titre indicatif.]'},
  {date:'[Exemple : 22/10/2026]', heure:'[Ex. 10h00]', titre:'[Exemple - Sortie pédagogique]', lieu:'[Exemple - Extérieur]', description:'[Exemple - Description à titre indicatif.]'},
  {date:'[Exemple : 12/11/2026]', heure:'[Ex. 09h00]', titre:'[Exemple - Conseil de classe]', lieu:'[Exemple - Salle de réunion]', description:'[Exemple - Description à titre indicatif.]'}
];
document.getElementById('events-toutes').innerHTML = evenements.map(e=>
  <div class='card' style='padding:20px 24px;'>
    <div style='display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px;'>
      <div style='font-weight:600; color:var(--navy-dark);'></div>
      <div style='font-size:.9rem; color:var(--ink-soft);'> • </div>
    </div>
    <div style='font-size:.92rem; color:var(--ink-soft); margin-bottom:6px;'>Lieu : </div>
    <p style='color:var(--ink-soft); margin:0; line-height:1.6;'></p>
  </div>
).join('');
</script>
</body>
</html>
