<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes applis — Collège Saint-Exupéry</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
<style>
  .applis-wrap{max-width:920px;margin:0 auto;padding:32px 24px 64px;}
  .applis-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:26px;}
  .applis-head h1{font-family:'Fraunces',serif;color:var(--navy-dark);font-size:1.5rem;margin:0;}
  .fav-toggle{
    background:var(--gold);border:none;color:var(--navy-dark);font-weight:600;
    padding:10px 18px;border-radius:7px;cursor:pointer;font-size:.85rem;font-family:'Inter',sans-serif;
  }
  .fav-toggle.active{background:var(--navy);color:#fff;}
  .fav-section{margin-bottom:32px;}
  .fav-section h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 14px;}
  .applis-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));
    gap:16px;
  }
  .app-tile{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 10px;
    text-align:center;
    text-decoration:none;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, box-shadow .15s;
    position:relative;
  }
  .app-tile:hover{border-color:var(--sky);box-shadow:0 2px 8px rgba(13,59,102,.08);}
  .app-tile .icon{font-size:2rem;margin-bottom:10px;}
  .app-tile .name{font-size:.8rem;font-weight:600;line-height:1.3;}
  .app-tile .fav-star{
    position:absolute;top:8px;right:8px;font-size:1rem;opacity:.35;
  }
  .app-tile.is-fav .fav-star{opacity:1;}
  .app-tile.edit-mode{border-style:dashed;}
  .empty-fav{color:var(--ink-soft);font-size:.85rem;font-style:italic;}
</style>
</head>
<body>
<script src="protect.js"></script>

<div class="topbar">
  <div class="topbar-inner">
    <img src="assets/favicon.png" alt="Collège Saint-Exupéry">
    <div class="topbar-text">
      <div class="etab">Collège Saint-Exupéry</div>
      <div class="sub">Mes applis</div>
    </div>
  </div>
</div>

<div class="applis-wrap">
  <a href="espace.html" class="back-link">← Retour à mon espace</a>

  <div class="applis-head">
    <h1>Mes applis</h1>
    <button class="fav-toggle" id="btn-edit-fav">⭐ Gérer mes favoris</button>
  </div>

  <div class="fav-section">
    <h2>Favoris</h2>
    <div class="applis-grid" id="fav-grid"></div>
  </div>

  <div class="fav-section">
    <h2>Toutes mes applis</h2>
    <div class="applis-grid" id="all-grid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth-guard.js"></script>
<script>
const APPS = [
  { id: 'pronote', name: 'Pronote', logo: 'https://www.google.com/s2/favicons?sz=64&domain=index-education.fr', url: 'http://87.88.47.69:81/pronote/professeur.html' },
  { id: 'geogebra', name: 'GeoGebra', logo: 'https://www.google.com/s2/favicons?sz=64&domain=geogebra.org', url: 'https://www.geogebra.org/classic' },
  { id: 'padlet', name: 'Padlet', logo: 'https://www.google.com/s2/favicons?sz=64&domain=padlet.com', url: 'https://padlet.com' },
  { id: 'canva', name: 'Canva', logo: 'https://www.google.com/s2/favicons?sz=64&domain=canva.com', url: 'https://www.canva.com' },
  { id: 'wordwall', name: 'Wordwall', logo: 'https://www.google.com/s2/favicons?sz=64&domain=wordwall.net', url: 'https://wordwall.net' },
  { id: 'learningapps', name: 'LearningApps', logo: 'https://www.google.com/s2/favicons?sz=64&domain=learningapps.org', url: 'https://learningapps.org' },
  { id: 'quizlet', name: 'Quizlet', logo: 'https://www.google.com/s2/favicons?sz=64&domain=quizlet.com', url: 'https://quizlet.com' },
  { id: 'documents', name: 'Espace documentaire', icon: '📁', url: 'espace-documentaire.html', internal: true }
];

let editMode = false;
let favoris = [];
let userId = null;

(async () => {
  const user = await requireAuth();
  if (!user) return;
  userId = user.id;

  const { data: compte } = await supabaseClient.from('comptes_ecole').select('favoris').eq('id', user.id).single();
  favoris = compte?.favoris || [];
  render();
})();

document.getElementById('btn-edit-fav').addEventListener('click', () => {
  editMode = !editMode;
  const btn = document.getElementById('btn-edit-fav');
  btn.classList.toggle('active', editMode);
  btn.textContent = editMode ? '✓ Terminer' : '⭐ Gérer mes favoris';
  render();
});

function render() {
  const favGrid = document.getElementById('fav-grid');
  const allGrid = document.getElementById('all-grid');

  const favApps = APPS.filter(a => favoris.includes(a.id));
  favGrid.innerHTML = favApps.length
    ? favApps.map(a => tileHtml(a)).join('')
    : '<span class="empty-fav">Aucun favori pour l\'instant — clique sur "Gérer mes favoris" pour en ajouter.</span>';

  allGrid.innerHTML = APPS.map(a => tileHtml(a)).join('');
}

function tileHtml(app) {
  const isFav = favoris.includes(app.id);
  const cls = `app-tile ${isFav ? 'is-fav' : ''} ${editMode ? 'edit-mode' : ''}`;
  const visual = app.icon
    ? `<div class="icon">${app.icon}</div>`
    : `<div class="icon"><img src="${app.logo}" alt="${app.name}" style="width:32px;height:32px;object-fit:contain;"></div>`;
  return `
    <div class="${cls}" onclick="handleTileClick('${app.id}', '${app.url}', ${app.internal ? 'true' : 'false'})">
      <span class="fav-star">⭐</span>
      ${visual}
      <div class="name">${app.name}</div>
    </div>`;
}

async function handleTileClick(id, url, internal) {
  if (editMode) {
    if (favoris.includes(id)) {
      favoris = favoris.filter(f => f !== id);
    } else {
      favoris.push(id);
    }
    await supabaseClient.from('comptes_ecole').update({ favoris }).eq('id', userId);
    render();
    return;
  }
  if (internal) {
    window.location.href = url;
  } else {
    window.open(url, '_blank');
  }
}
</script>

</body>
</html>
