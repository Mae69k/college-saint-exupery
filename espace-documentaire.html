<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace documentaire — Collège Saint-Exupéry</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
<style>
  .doc-wrap{max-width:820px;margin:0 auto;padding:32px 24px 64px;}
  .doc-wrap h1{font-family:'Fraunces',serif;color:var(--navy-dark);font-size:1.5rem;margin:0 0 22px;}
  .dropzone{
    border:2px dashed var(--line);
    border-radius:12px;
    padding:48px 24px;
    text-align:center;
    background:var(--card);
    cursor:pointer;
    transition:border-color .15s, background .15s;
    margin-bottom:28px;
  }
  .dropzone.dragover{border-color:var(--sky);background:#eaf6fd;}
  .dropzone .icon{font-size:2.4rem;margin-bottom:12px;}
  .dropzone p{margin:0;color:var(--ink-soft);font-size:.92rem;}
  .dropzone p.small{font-size:.78rem;margin-top:6px;}
  #file-input{display:none;}

  .upload-progress{
    display:none;
    margin-bottom:20px;
    font-size:.85rem;
    color:var(--ink-soft);
  }

  .file-list{list-style:none;padding:0;margin:0;}
  .file-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
    padding:14px 18px;
    margin-bottom:10px;
  }
  .file-item .file-info{display:flex;align-items:center;gap:12px;}
  .file-item .file-icon{font-size:1.4rem;}
  .file-item .file-name{font-weight:600;font-size:.9rem;color:var(--navy-dark);}
  .file-item .file-meta{font-size:.75rem;color:var(--ink-soft);}
  .file-actions{display:flex;gap:8px;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:.9rem;}
</style>
</head>
<body>
<script src="protect.js"></script>

<div class="topbar">
  <div class="topbar-inner">
    <img src="assets/favicon.png" alt="Collège Saint-Exupéry">
    <div class="topbar-text">
      <div class="etab">Collège Saint-Exupéry</div>
      <div class="sub">Espace documentaire</div>
    </div>
  </div>
</div>

<div class="doc-wrap">
  <a href="mes-applis.html" class="back-link">← Retour à mes applis</a>
  <h1>Espace documentaire</h1>

  <div class="dropzone" id="dropzone">
    <div class="icon">📁</div>
    <p>Glisse un fichier ici, ou clique pour en sélectionner un</p>
    <p class="small">Tes fichiers restent ici, visibles uniquement par toi.</p>
    <input type="file" id="file-input">
  </div>

  <div class="upload-progress" id="upload-progress">Envoi en cours...</div>

  <ul class="file-list" id="file-list"></ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth-guard.js"></script>
<script>
let userId = null;
const BUCKET = 'espace-documentaire';

(async () => {
  const user = await requireAuth();
  if (!user) return;
  userId = user.id;
  loadFiles();
})();

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) uploadFile(fileInput.files[0]);
});

['dragenter', 'dragover'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
});
['dragleave', 'drop'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); });
});
dropzone.addEventListener('drop', (e) => {
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(file);
});

function sanitizeFilename(name) {
  return name
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // retire les accents
    .replace(/[^a-zA-Z0-9.\-_]/g, '_'); // remplace espaces/caractères spéciaux
}

async function uploadFile(file) {
  const progress = document.getElementById('upload-progress');
  progress.style.display = 'block';
  progress.textContent = `Envoi de "${file.name}"...`;

  const path = `${userId}/${Date.now()}-${sanitizeFilename(file.name)}`;
  const { error } = await supabaseClient.storage.from(BUCKET).upload(path, file);

  progress.style.display = 'none';
  fileInput.value = '';

  if (error) {
    alert('Erreur lors de l\'envoi : ' + error.message);
    return;
  }
  loadFiles();
}

async function loadFiles() {
  const list = document.getElementById('file-list');
  const { data, error } = await supabaseClient.storage.from(BUCKET).list(userId, { sortBy: { column: 'created_at', order: 'desc' } });

  if (error || !data || data.length === 0) {
    list.innerHTML = '<div class="empty-state">Aucun fichier pour l\'instant.</div>';
    return;
  }

  list.innerHTML = data.map(f => `
    <li class="file-item">
      <div class="file-info">
        <span class="file-icon">📄</span>
        <div>
          <div class="file-name">${escapeHtml(f.name.replace(/^\d+-/, ''))}</div>
          <div class="file-meta">${formatSize(f.metadata?.size)}</div>
        </div>
      </div>
      <div class="file-actions">
        <button class="action-btn" onclick="downloadFile('${escapeHtml(f.name)}')">⬇ Télécharger</button>
        <button class="action-btn delete" onclick="deleteFile('${escapeHtml(f.name)}')">🗑 Supprimer</button>
      </div>
    </li>
  `).join('');
}

async function downloadFile(name) {
  const { data, error } = await supabaseClient.storage.from(BUCKET).createSignedUrl(`${userId}/${name}`, 60);
  if (error) { alert('Erreur : ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

async function deleteFile(name) {
  if (!confirm('Supprimer ce fichier définitivement ?')) return;
  await supabaseClient.storage.from(BUCKET).remove([`${userId}/${name}`]);
  loadFiles();
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' o';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' Ko';
  return (bytes / (1024 * 1024)).toFixed(1) + ' Mo';
}
</script>

</body>
</html>
