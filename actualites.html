<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Actualités - Collège Saint-Exupéry</title>
<link rel='icon' type='image/png' href='assets/favicon.png'>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<script src='protect.js'></script>
<div class='topbar'>
  <div class='topbar-inner'>
    <img src='assets/favicon.png' alt='Collège Saint-Exupéry'>
    <div class='topbar-text'>
      <div class='etab'>Collège Saint-Exupéry</div>
      <div class='sub'>Actualités</div>
    </div>
  </div>
</div>
<div class='wrap' style='padding-top:32px; max-width:820px;'>
  <a href='index.html' class='back-link'>← Retour à l'accueil</a>
  <h1 style='font-family:Arial, sans-serif; color:var(--navy-dark); margin:14px 0 24px;'>Actualités du collège</h1>
  <div id='actus-toutes' style='display:flex; flex-direction:column; gap:20px;'></div>
</div>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<script src='config.js'></script>
<script src='contenu-site.js'></script>
<script>
let actualites = CONTENU_DEFAUT.actualites;

function afficherActualites() {
  const zone = document.getElementById('actus-toutes');

  if (actualites.length === 0) {
    zone.innerHTML = '<p style="color:var(--ink-soft);">Aucune actuelle pour le moment.</p>';
    return;
  }

  zone.innerHTML = actualites.map(a => `
    <div class='card'>
      <div style='font-size:.85rem; color:var(--ink-soft); margin-bottom:8px;'>${echapperTexte(a.date)}</div>
      <h3 style='margin:0 0 10px; font-family:Arial,sans-serif; color:var(--navy-dark);'>${echapperTexte(a.titre)}</h3>
      <p style='color:var(--ink-soft); line-height:1.6; margin:0;'>${echapperTexte(a.description)}</p>
    </div>`).join('');
}

afficherActualites();

chargerContenu().then(contenu => {
  actualites = contenu.actualites;
  afficherActualites();
});
</script>
</body>
</html>
